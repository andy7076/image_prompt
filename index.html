<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f4ef" />
    <meta name="description" content="A curated gallery of high-signal GPT-Image-2 prompts." />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="mask-icon" href="%BASE_URL%favicon.svg" color="#c7f36b" />
    <script>
      (() => {
        try {
          const theme = localStorage.getItem('prompt-signal:theme:v1') === 'dark' ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#0a0a0a' : '#f4f4ef')
        } catch {
          document.documentElement.dataset.theme = 'light'
          document.documentElement.style.colorScheme = 'light'
        }
      })()
    </script>
    <script>
      (() => {
        const currentVersion = '__PROMPT_SIGNAL_BUILD_VERSION__'
        const versionUrl = '%BASE_URL%version.json?check=' + Date.now()
        fetch(versionUrl, { cache: 'no-store' })
          .then((response) => response.ok ? response.json() : null)
          .then((latest) => {
            if (!latest?.version || latest.version === currentVersion) return
            const url = new URL(window.location.href)
            url.searchParams.set('v', latest.version)
            window.location.replace(url.toString())
          })
          .catch(() => {})
      })()
    </script>
    <title>PROMPT/SIGNAL - GPT-Image-2 Gallery</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
